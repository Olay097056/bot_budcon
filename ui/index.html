<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bot_budcon</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e6e9ef;
        --muted: #8b95a4;
        --accent: #6ee7b7;
        --warn: #fbbf24;
        --err: #f87171;
        --border: #1f2937;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
      header { display: flex; align-items: baseline; gap: 12px; }
      h1 { font-size: 18px; margin: 0; }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        vertical-align: middle;
      }
      .dot.alive  { background: var(--accent); }
      .dot.warn   { background: var(--warn); }
      .dot.err    { background: var(--err); }
      section { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; }
      button {
        background: var(--accent);
        color: #04140d;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
      }
      button[disabled] { opacity: 0.5; cursor: not-allowed; }
      button.secondary { background: var(--border); color: var(--fg); }
      select, input {
        background: #06080c;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        margin-right: 8px;
      }
      pre {
        margin: 0;
        background: #06080c;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        max-height: 240px;
        overflow: auto;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .row .kv { display: flex; flex-direction: column; }
      .row .kv span:first-child { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      .row .kv span:last-child  { font: 13px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>bot_budcon</h1>
        <span id="dot" class="dot" title="engine status"></span>
        <span id="status-text" style="color: var(--muted)">connecting…</span>
      </header>

      <section>
        <h2>Engine</h2>
        <div class="row">
          <div class="kv"><span>chromeAlive</span><span id="chromeAlive">—</span></div>
          <div class="kv"><span>loggedIn</span><span id="loggedIn">—</span></div>
          <div class="kv"><span>watchActive</span><span id="watchActive">—</span></div>
          <div class="kv"><span>sensorReady</span><span id="sensorReady">—</span></div>
        </div>
      </section>

      <section>
        <h2>Auth cookie gate (ticket 10)</h2>
        <div class="row">
          <span id="auth-dot" class="dot" title="gate verdict"></span>
          <span id="auth-text" style="color: var(--muted)">checking…</span>
          <div class="kv" style="margin-left: auto;"><span>expires in</span><span id="auth-expires">—</span></div>
        </div>
        <p id="auth-detail" style="color: var(--muted); margin: 8px 0 0; font-size: 12px;"></p>
      </section>

      <section>
        <h2>Watch (ticket 15)</h2>
        <div class="row">
          <span id="watch-dot" class="dot" title="watch status"></span>
          <span id="watch-text" style="color: var(--muted)">idle</span>
          <div class="kv" style="margin-left: auto;"><span>polls</span><span id="watch-polls">0</span></div>
          <div class="kv"><span>target</span><span id="watch-target">—</span></div>
        </div>
        <p id="watch-detail" style="color: var(--muted); margin: 8px 0 0; font-size: 12px;"></p>
        <p id="watch-event" style="color: var(--accent); margin: 8px 0 0; font-size: 12px; font-weight: 600;"></p>
      </section>

      <section>
        <h2>Actions</h2>
        <div class="row" style="margin-bottom: 10px;">
          <button id="login-btn" type="button" title="Spawns an invisible (C++-patched) Firefox to bypass Akamai">🔓 Login (invisible)</button>
          <button id="relogin-btn" type="button" class="secondary" disabled>🔁 Re-login</button>
        </div>
        <div class="row" style="margin-bottom: 10px;">
          <select id="target-select" title="Pick TTM target (query)">
            <option value="idol1st">idol1st (504)</option>
            <option value="lany">lany</option>
            <option value="joji">joji</option>
            <option value="babymonster">babymonster</option>
            <option value="dreaming">dreaming</option>
          </select>
          <button id="watch-btn" type="button" class="secondary" disabled>🎯 Watch</button>
          <button id="stop-btn"  type="button" class="secondary" disabled>⏹ Stop</button>
        </div>
        <div class="row">
          <input id="book-code" type="text" placeholder="zone code (A1)" style="width: 120px;" maxlength="10" />
          <button id="book-btn" type="button" class="secondary" disabled>🎯 Book Now</button>
          <span style="color: var(--muted); font-size: 11px;">manual — uses last watch event if blank</span>
        </div>
        <p id="action-note" style="color: var(--muted); margin: 8px 0 0;"></p>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let lastAuth = null;
      let lastWatch = null;

      async function tick() {
        try {
          const r = await fetch('/api/status');
          if (!r.ok) throw new Error('status ' + r.status);
          const s = await r.json();
          $('chromeAlive').textContent = String(s.chromeAlive);
          $('loggedIn').textContent   = String(s.loggedIn);
          $('watchActive').textContent = String(s.watchActive);
          $('sensorReady').textContent = String(s.sensorReady);

          const dot = $('dot');
          const label = $('status-text');
          if (!s.sensorReady) {
            dot.className = 'dot err';
            label.textContent = 'sensor not ready';
          } else if (s.loggedIn && s.watchActive) {
            dot.className = 'dot alive';
            label.textContent = 'watching';
          } else if (s.loggedIn) {
            dot.className = 'dot alive';
            label.textContent = 'logged in';
          } else if (s.chromeAlive) {
            dot.className = 'dot warn';
            label.textContent = 'browser ready, not logged in';
          } else {
            dot.className = 'dot';
            label.textContent = s.loggedIn ? 'logged in' : 'idle';
          }

          // Buttons — use lastAuth for relogin gate, s for loggedIn/watchActive
          const authOk = lastAuth ? lastAuth.accept : s.loggedIn;
          $('login-btn').disabled  = s.loggedIn || s.watchActive;
          $('watch-btn').disabled  = !s.loggedIn || s.watchActive;
          $('stop-btn').disabled   = !s.watchActive;
          // Book enabled when watch has seen a zone OR user typed a code and we are logged in
          const hasZone = !!(lastWatch && lastWatch.lastEvent);
          const codeTyped = $('book-code').value.trim().length > 0;
          $('book-btn').disabled = !s.loggedIn || (!hasZone && !codeTyped);
          if (lastAuth && lastAuth.lastRelogin && lastAuth.lastRelogin.lastResult === 'in_progress') {
            $('relogin-btn').disabled = true;
          } else if (!authOk) {
            $('relogin-btn').disabled = false;
          } else {
            $('relogin-btn').disabled = true;
          }

          const log = $('log');
          log.textContent = (s.lastLog || []).slice(-50).join('\n');
          log.scrollTop = log.scrollHeight;
        } catch (e) {
          $('status-text').textContent = 'unreachable (' + e.message + ')';
          $('dot').className = 'dot err';
        }
      }

      async function authTick() {
        const dot = $('auth-dot');
        const text = $('auth-text');
        const expiresEl = $('auth-expires');
        const detailEl = $('auth-detail');
        try {
          const r = await fetch('/api/auth/status');
          if (!r.ok) throw new Error('auth ' + r.status);
          const g = await r.json();
          lastAuth = g;
          if (g.pill === 'ok') {
            dot.className = 'dot alive';
            text.textContent = 'Authenticated';
            text.style.color = 'var(--accent)';
          } else if (g.pill === 'expiring') {
            dot.className = 'dot warn';
            text.textContent = 'Session expiring soon';
            text.style.color = 'var(--warn)';
          } else if (g.lastRelogin && g.lastRelogin.lastResult === 'in_progress') {
            dot.className = 'dot warn';
            text.textContent = 'Re-logging in…';
            text.style.color = 'var(--warn)';
          } else {
            dot.className = 'dot err';
            text.textContent = g.reason === 'expired'
              ? 'Auth cookie expired'
              : g.reason === 'no_phase1'
                ? 'Phase-1 cookie missing'
                : 'Login required';
            text.style.color = 'var(--err)';
          }
          if (g.expiresInSec === null) {
            expiresEl.textContent = 'session';
          } else if (g.expiresInSec < 60) {
            expiresEl.textContent = g.expiresInSec + 's';
          } else if (g.expiresInSec < 3600) {
            expiresEl.textContent = Math.floor(g.expiresInSec / 60) + 'm';
          } else {
            expiresEl.textContent = Math.floor(g.expiresInSec / 3600) + 'h';
          }
          const detailBits = [];
          if (g.primary) detailBits.push('primary=' + g.primary);
          detailBits.push('auth=' + g.authCount);
          detailBits.push('phase1=' + g.phase1Count);
          if (g.reason) detailBits.push('reason=' + g.reason);
          detailEl.textContent = detailBits.join(' · ');
        } catch (e) {
          dot.className = 'dot err';
          text.textContent = 'unreachable (' + e.message + ')';
          text.style.color = 'var(--err)';
        }
      }

      async function watchTick() {
        const dot = $('watch-dot');
        const text = $('watch-text');
        const pollsEl = $('watch-polls');
        const targetEl = $('watch-target');
        const detailEl = $('watch-detail');
        const eventEl = $('watch-event');
        try {
          const r = await fetch('/api/watch/status');
          if (!r.ok) throw new Error('watch ' + r.status);
          const w = await r.json();
          lastWatch = w;
          pollsEl.textContent = String(w.pollCount ?? 0);
          if (w.url) {
            try { targetEl.textContent = new URL(w.url).searchParams.get('query') || w.url.slice(-30); } catch { targetEl.textContent = w.url.slice(-30); }
          } else {
            targetEl.textContent = '—';
          }
          if (w.active) {
            dot.className = 'dot alive';
            text.textContent = 'Watching';
            text.style.color = 'var(--accent)';
            const baseline = w.baseline ? w.baseline.join(',') : '…';
            const lastZones = w.lastZones ? w.lastZones.join(',') : '…';
            detailEl.textContent = `baseline: ${baseline} · last: ${lastZones}`;
          } else {
            dot.className = 'dot';
            text.textContent = w.pollCount > 0 ? 'Stopped' : 'Idle';
            text.style.color = 'var(--muted)';
            if (w.lastError) detailEl.textContent = `last error: ${w.lastError}`;
            else if (w.baseline) detailEl.textContent = `baseline: ${w.baseline.join(',')} · last: ${(w.lastZones||[]).join(',')}`;
            else detailEl.textContent = '';
          }
          if (w.lastEvent) {
            eventEl.textContent = `★ NEW zone ${w.lastEvent.code} @ ${new Date(w.lastEvent.observedAtMs).toLocaleTimeString()} — ready to Book`;
          } else {
            eventEl.textContent = '';
          }
          // Enable Book button if we have a lastEvent or typed code
          const s = { loggedIn: lastAuth ? lastAuth.accept : false, watchActive: w.active };
          const codeTyped = $('book-code').value.trim().length > 0;
          $('book-btn').disabled = !s.loggedIn || (!w.lastEvent && !codeTyped);
        } catch (e) {
          dot.className = 'dot err';
          text.textContent = 'unreachable (' + e.message + ')';
          text.style.color = 'var(--err)';
        }
      }

      $('login-btn').addEventListener('click', async () => {
        $('action-note').textContent = 'starting login…';
        try {
          const r = await fetch('/api/login/start', { method: 'POST' });
          const body = await r.text();
          $('action-note').textContent = r.ok ? 'login started — complete captcha in Firefox' : ('login: ' + r.status + ' ' + body);
        } catch (e) {
          $('action-note').textContent = 'login error: ' + e.message;
        }
      });

      $('relogin-btn').addEventListener('click', async () => {
        $('relogin-btn').disabled = true;
        $('action-note').textContent = 're-login in progress…';
        try {
          const r = await fetch('/api/auth/relogin', { method: 'POST' });
          const body = await r.json();
          if (body.lastResult === 'ok') $('action-note').textContent = 're-login succeeded';
          else if (body.lastResult === 'in_progress') $('action-note').textContent = 're-login already in progress';
          else if (body.lastResult === 'backoff') $('action-note').textContent = 're-login skipped — inside back-off window';
          else $('action-note').textContent = 're-login did not refresh auth — complete the captcha manually';
        } catch (e) {
          $('action-note').textContent = 're-login error: ' + e.message;
        } finally {
          $('relogin-btn').disabled = false;
          authTick();
        }
      });

      $('watch-btn').addEventListener('click', async () => {
        const target = $('target-select').value;
        $('action-note').textContent = 'starting watch for ' + target + '…';
        $('watch-btn').disabled = true;
        try {
          const r = await fetch('/api/watch/start', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ target }) });
          const body = await r.json();
          if (r.ok) $('action-note').textContent = 'watch started → ' + body.url;
          else if (r.status === 409) $('action-note').textContent = 'watch already active → ' + (body.url||'');
          else if (r.status === 401) $('action-note').textContent = 'watch refused — ' + (body.error||'no_auth') + ' — login first';
          else $('action-note').textContent = 'watch: ' + r.status + ' ' + JSON.stringify(body);
        } catch (e) {
          $('action-note').textContent = 'watch error: ' + e.message;
        } finally {
          watchTick(); tick();
        }
      });

      $('stop-btn').addEventListener('click', async () => {
        $('action-note').textContent = 'stopping watch…';
        try {
          const r = await fetch('/api/watch/stop', { method: 'POST' });
          const body = await r.json();
          $('action-note').textContent = body.ok ? 'watch stopped' : 'stop: ' + JSON.stringify(body);
        } catch (e) {
          $('action-note').textContent = 'stop error: ' + e.message;
        } finally {
          watchTick(); tick();
        }
      });

      $('book-btn').addEventListener('click', async () => {
        let code = $('book-code').value.trim().toUpperCase();
        if (!code && lastWatch && lastWatch.lastEvent) code = lastWatch.lastEvent.code;
        if (!code) { $('action-note').textContent = 'book: need zone code'; return; }
        const zonesUrl = lastWatch && lastWatch.url ? lastWatch.url : `https://booking.thaiticketmajor.com/booking/3m/zones.php?query=${$('target-select').value==='idol1st'?'504':$('target-select').value}`;
        $('action-note').textContent = 'booking ' + code + '…';
        $('book-btn').disabled = true;
        try {
          const r = await fetch('/api/book/start', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, zonesUrl, quantity: 1 }) });
          const body = await r.json();
          if (body.humanStep) $('action-note').textContent = 'book paused at ' + body.step + ' — complete captcha/payment in Firefox';
          else if (body.ok) $('action-note').textContent = 'book ok: ' + JSON.stringify(body);
          else $('action-note').textContent = 'book ' + (body.step||'') + ': ' + (body.error||JSON.stringify(body));
        } catch (e) {
          $('action-note').textContent = 'book error: ' + e.message;
        } finally {
          $('book-btn').disabled = false;
        }
      });

      $('book-code').addEventListener('input', () => { tick(); watchTick(); });

      tick();
      authTick();
      watchTick();
      setInterval(tick, 2000);
      setInterval(authTick, 2000);
      setInterval(watchTick, 2000);
    </script>
  </body>
</html>
